<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>직접 분석 · Olist</title>
<style>
:root{--paper:#F3F1EB;--panel:#EAE7DE;--ink:#111;--mute:#6F6C64;--line:#D8D4C9;--g:#E04A1F;--ok:#85827A}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,'Noto Sans KR',system-ui,sans-serif}
a{color:var(--g)}header{display:flex;gap:18px;align-items:baseline;padding:16px 28px;border-bottom:1px solid var(--line)}
header b{font-size:18px}header span{color:var(--mute);font-size:13px}header a{margin-left:auto;font-size:13px;font-weight:700}
main{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 57px)}
aside{padding:20px 22px 40px;border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 57px);position:sticky;top:0}
section{padding:22px 32px 60px;min-width:0}
h3{margin:22px 0 8px;font-size:12px;letter-spacing:.04em;color:var(--mute)}h3:first-child{margin-top:0}
select{width:100%;padding:8px 10px;font:inherit;border:1.5px solid var(--ink);background:var(--paper);border-radius:4px}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer;font-weight:700;font-size:13.5px;padding:4px 0}summary small{color:var(--g);font-weight:700;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow-y:auto;padding:6px 0}
.chips button{padding:3px 10px;border:1px solid var(--ink);border-radius:999px;background:transparent;font:inherit;font-size:12px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff}
.mini{font-size:12px;margin:2px 0 0;color:var(--mute)}.mini a{cursor:pointer;font-weight:700}
#sum{font-size:15px;line-height:1.7;padding:12px 16px;background:var(--panel);margin-bottom:18px}#sum b{font-size:19px}
.row{display:grid;grid-template-columns:minmax(120px,210px) 1fr 140px;gap:12px;align-items:center;padding:6px 4px;border-top:1px solid var(--line)}
.row:hover{background:rgba(0,0,0,.04)}.row .nm{font-size:13.5px;font-weight:700;line-height:1.3}.row .nm small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.row .t{position:relative;height:22px;background:#E4E1D8}.row .t i{position:absolute;left:0;top:0;bottom:0;background:var(--g)}.row .t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.row.lo .t i{background:#B5B1A6}.row .v{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}.row .v small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.legend{font-size:12px;color:var(--mute);margin:8px 0 14px}.legend u{display:inline-block;width:2px;height:12px;background:var(--ink);vertical-align:middle;margin:0 4px}
table{border-collapse:collapse;font-size:13px;width:100%}th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left;font-weight:700}th{font-size:12px;color:var(--mute);position:sticky;top:0;background:var(--paper)}
.hm td.c{min-width:64px}.scroll{overflow-x:auto}.note{margin-top:22px;padding:12px 16px;border-left:3px solid var(--ink);font-size:13px;color:#333;background:var(--panel)}
.bar2{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap}.bar2 button{padding:6px 14px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}.bar2 button[aria-pressed=true]{background:var(--ink);color:#fff}
.ptip{position:fixed;z-index:50;pointer-events:none;background:#111;color:#fff;padding:7px 11px;border-radius:4px;font-size:12px;line-height:1.5;opacity:0}.ptip.on{opacity:1}
svg text{font:11px Inter,'Noto Sans KR',sans-serif;fill:var(--mute)}
@media(max-width:820px){main{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}section{padding:18px 16px 50px}.row{grid-template-columns:100px 1fr 96px}}
</style></head><body>
<header><b>직접 분석</b><span>Olist 주문 99,441건 · 기준과 지표를 골라 직접 집계합니다</span><a href="index.html">← 탐색 화면</a><a href="story.html" style="margin-left:0">분석 이야기</a></header>
<main>
<aside>
<h3>1 · 무엇으로 나눌까 (가로축)</h3><select id="x"></select>
<h3>2 · 한 번 더 나누기 (선택)</h3><select id="z"></select>
<h3>3 · 무엇을 볼까 (지표)</h3><select id="y"></select>
<h3>4 · 조건 걸기 (필터)</h3><div id="flt"></div>
<p class="mini"><a id="reset">조건 모두 해제</a> · <a id="share">현재 설정 링크 복사</a> <span id="copied"></span></p>
<h3>빠른 시작</h3>
<div class="chips" style="max-height:none" id="pre"></div>
</aside>
<section>
<div id="sum"></div>
<div class="bar2"><span id="ttl" style="font-weight:800"></span><span style="flex:1"></span><span class="mini">정렬</span><button id="s0" aria-pressed="true">기본</button><button id="s1" aria-pressed="false">값 큰 순</button><button id="s2" aria-pressed="false">주문 많은 순</button></div>
<div id="out"></div>
<div class="note" id="caveat"></div>
</section></main>
<script src="data/orders.js"></script>
<script>
(function(){
var D=window.OLIST.dims,C=window.OLIST.cols,N=C.m.length,$=function(i){return document.getElementById(i)};
var fmt=function(n){return Math.round(n).toLocaleString('ko-KR')};
function bucket(v,cuts,labels){for(var i=0;i<cuts.length;i++)if(v<cuts[i])return i;return cuts.length}
var DIM={
 m:{l:'월',lab:D.m,get:function(i){return C.m[i]},time:1},
 c:{l:'상품 카테고리',lab:D.c,get:function(i){return C.c[i]},top:1},
 s:{l:'고객 지역(주)',lab:D.sKo,get:function(i){return C.s[i]},top:1},
 pt:{l:'결제 수단',lab:D.pt,get:function(i){return C.pt[i]}},
 dl:{l:'배송 지연',lab:D.dl,get:function(i){return C.dl[i]}},
 ot:{l:'주문 구성',lab:D.ot,get:function(i){return C.ot[i]}},
 sz:{l:'판매자 규모',lab:D.sz,get:function(i){return C.sz[i]}},
 st:{l:'주문 상태',lab:D.st,get:function(i){return C.st[i]}},
 dd:{l:'배송 소요일',lab:['0~7일','8~14일','15~21일','22~30일','31일 이상','미배송'],get:function(i){var v=C.dd[i];return v<0?5:bucket(v,[8,15,22,31])}},
 pv:{l:'결제 금액',lab:['R$50 미만','R$50~100','R$100~200','R$200~500','R$500 이상'],get:function(i){return bucket(C.pv[i],[50,100,200,500])}},
 n:{l:'주문 상품 수',lab:['1개','2개','3개','4개 이상'],get:function(i){return Math.min(C.n[i],4)-1<0?0:Math.min(C.n[i],4)-1}}
};
var KEYS=Object.keys(DIM);
// 지표: 비율형은 분자/분모로 표본 크기와 신뢰구간을 같이 보여 준다
var MET={
 cnt:{l:'주문 수',kind:'n'},
 late:{l:'늦게 도착한 비율',kind:'p',num:function(i){return C.dl[i]>=1&&C.dl[i]<=3},den:function(i){return C.dl[i]<=3},dn:'도착 기록 있는 주문'},
 neg:{l:'부정 리뷰 비율 (1~2점)',kind:'p',num:function(i){return C.rs[i]>=1&&C.rs[i]<=2},den:function(i){return C.rs[i]>0},dn:'리뷰 있는 주문'},
 five:{l:'5점 비율',kind:'p',num:function(i){return C.rs[i]===5},den:function(i){return C.rs[i]>0},dn:'리뷰 있는 주문'},
 rs:{l:'평균 별점',kind:'m',val:function(i){return C.rs[i]>0?C.rs[i]:null},d:2,dn:'리뷰 있는 주문'},
 dd:{l:'평균 배송 소요일',kind:'m',val:function(i){return C.dd[i]>=0?C.dd[i]:null},d:1,dn:'배송 완료 주문'},
 pv:{l:'결제 금액 평균 (R$)',kind:'m',val:function(i){return C.pv[i]},d:0,dn:'전체 주문'},
 multi:{l:'여러 판매자 주문 비율',kind:'p',num:function(i){return C.ot[i]===3},den:function(i){return C.ot[i]!==4},dn:'상품 정보 있는 주문'}
};
var MK=Object.keys(MET);
var S={x:'dl',z:'',y:'neg',f:{},sort:0};
// 필터
var FK=['m','c','s','pt','dl','ot','sz','st'];
function selectFill(el,opts,blank){el.innerHTML=(blank?'<option value="">없음</option>':'')+opts.map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>'}).join('')}
selectFill($('x'),KEYS.map(function(k){return[k,DIM[k].l]}));
selectFill($('z'),KEYS.map(function(k){return[k,DIM[k].l]}),1);
selectFill($('y'),MK.map(function(k){return[k,MET[k].l]}));
function buildFilters(){
 $('flt').innerHTML='';
 FK.forEach(function(k){
  var d=document.createElement('details'),sel=S.f[k]||[];
  d.innerHTML='<summary>'+DIM[k].l+'<small>'+(sel.length?sel.length+'개 선택':'')+'</small></summary><div class="chips"></div>';
  var box=d.querySelector('.chips');
  DIM[k].lab.forEach(function(t,j){var b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-pressed',sel.indexOf(j)>=0);
   b.onclick=function(){var a=S.f[k]||[],p=a.indexOf(j);if(p>=0)a.splice(p,1);else a.push(j);S.f[k]=a;buildFilters();run()};box.appendChild(b)});
  if(sel.length)d.open=true;$('flt').appendChild(d)});
}
var tipEl=document.createElement('div');tipEl.className='ptip';document.body.appendChild(tipEl);
function tip(el,h){el.addEventListener('mousemove',function(e){tipEl.innerHTML=h;tipEl.classList.add('on');tipEl.style.left=Math.min(e.clientX+14,innerWidth-250)+'px';tipEl.style.top=Math.max(8,e.clientY-tipEl.offsetHeight-12)+'px'});el.addEventListener('mouseleave',function(){tipEl.classList.remove('on')})}
// 집계
function agg(groups,M,rows){
 var G={};
 rows.forEach(function(i){var g=groups(i);var o=G[g]||(G[g]={n:0,a:0,b:0,s:0,v:[]});o.n++;
  if(M.kind==='p'){if(M.den(i)){o.b++;if(M.num(i))o.a++}}
  else if(M.kind==='m'){var x=M.val(i);if(x!==null){o.b++;o.s+=x}}});
 return G}
function val(o,M){if(M.kind==='n')return o.n;if(!o.b)return null;return M.kind==='p'?o.a/o.b*100:o.s/o.b}
function ci(o,M){if(M.kind!=='p'||o.b<1)return null;var p=o.a/o.b,z=1.96,n=o.b,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return[Math.max(0,c-h)*100,Math.min(1,c+h)*100]}
function txt(v,M){if(v===null)return '–';if(M.kind==='n')return fmt(v);if(M.kind==='p')return v.toFixed(1)+'%';return v.toFixed(M.d)}
function run(){
 var X=DIM[S.x],Zd=S.z&&S.z!==S.x?DIM[S.z]:null,M=MET[S.y];
 var rows=[];
 for(var i=0;i<N;i++){var ok=true;for(var k in S.f){var a=S.f[k];if(a&&a.length&&a.indexOf(DIM[k].get(i))<0){ok=false;break}}if(ok)rows.push(i)}
 var all=agg(function(){return 0},M,rows)[0]||{n:0,a:0,b:0,s:0},ov=val(all,M);
 $('sum').innerHTML='선택한 주문 <b>'+fmt(rows.length)+'건</b> (전체의 '+(rows.length/N*100).toFixed(1)+'%) · '+M.l+' <b>'+txt(ov,M)+'</b>'+(M.kind!=='n'?' <span style="color:var(--mute);font-size:12.5px">('+M.dn+' '+fmt(all.b)+'건 기준)</span>':'');
 $('ttl').textContent=X.l+(Zd?' × '+Zd.l:'')+' 별 '+M.l;
 var gx=agg(function(i){return X.get(i)},M,rows);
 var order=Object.keys(gx).map(Number);
 if(X.top&&!X.time){order.sort(function(a,b){return gx[b].n-gx[a].n});order=order.slice(0,S.z?12:15)}
 if(S.sort===0)order.sort(function(a,b){return X.top?gx[b].n-gx[a].n:a-b});
 else if(S.sort===1)order.sort(function(a,b){return (val(gx[b],M)||-1e9)-(val(gx[a],M)||-1e9)});
 else order.sort(function(a,b){return gx[b].n-gx[a].n});
 var out=$('out');out.innerHTML='';
 if(!rows.length){out.innerHTML='<p>조건에 맞는 주문이 없습니다.</p>';return}
 if(!Zd){
  var vals=order.map(function(g){return val(gx[g],M)||0}),mx=Math.max.apply(null,vals.concat([ov||0,1e-9]));
  if(M.kind==='p')mx=Math.min(100,mx*1.1);else mx*=1.1;
  var lg=document.createElement('div');lg.className='legend';lg.innerHTML=(M.kind!=='n'?'<u></u>선택한 조건 전체 '+txt(ov,M)+' · ':'')+'회색 막대는 표본 30건 미만이라 해석에 주의'+(X.top?' · 주문이 많은 상위 '+order.length+'개만 표시':'');out.appendChild(lg);
  order.forEach(function(g,k){var o=gx[g],v=val(o,M),c=ci(o,M),r=document.createElement('div');r.className='row'+((M.kind==='n'?o.n:o.b)<30?' lo':'');
   r.innerHTML='<div class="nm">'+X.lab[g]+'<small>주문 '+fmt(o.n)+'건</small></div><div class="t"><i style="width:'+((v||0)/mx*100)+'%"></i>'+(M.kind!=='n'&&ov!==null?'<u style="left:'+(ov/mx*100)+'%"></u>':'')+'</div><div class="v">'+txt(v,M)+(c?'<small>95% '+c[0].toFixed(1)+'~'+c[1].toFixed(1)+'%</small>':M.kind!=='n'?'<small>'+fmt(o.b)+'건 기준</small>':'')+'</div>';
   out.appendChild(r);tip(r,'<b>'+X.lab[g]+'</b><br>주문 '+fmt(o.n)+'건'+(M.kind!=='n'?'<br>'+M.dn+' '+fmt(o.b)+'건':'')+'<br>'+M.l+' '+txt(v,M)+(c?'<br>95% 구간 '+c[0].toFixed(1)+'~'+c[1].toFixed(1)+'%':''))});
 }else{
  var gz=agg(function(i){return Zd.get(i)},M,rows),zs=Object.keys(gz).map(Number).sort(function(a,b){return Zd.top?gz[b].n-gz[a].n:a-b}).slice(0,8);
  var cell=agg(function(i){return X.get(i)*1000+Zd.get(i)},M,rows),all2=[];
  order.forEach(function(g){zs.forEach(function(z){var o=cell[g*1000+z];if(o){var v=val(o,M);if(v!==null)all2.push(v)}})});
  var lo=Math.min.apply(null,all2),hi=Math.max.apply(null,all2);
  var h='<div class="legend">셀 색이 진할수록 값이 큽니다 · 회색 글씨는 표본 30건 미만 · 열은 주문이 많은 상위 8개</div><div class="scroll"><table class="hm"><tr><th>'+X.l+' \\ '+Zd.l+'</th>'+zs.map(function(z){return '<th>'+Zd.lab[z]+'</th>'}).join('')+'<th>전체</th></tr>';
  order.forEach(function(g){h+='<tr><td>'+X.lab[g]+'</td>'+zs.map(function(z){var o=cell[g*1000+z];if(!o)return '<td class="c">–</td>';var v=val(o,M),n=M.kind==='n'?o.n:o.b,a=v===null||hi===lo?0:(v-lo)/(hi-lo);
   return '<td class="c" style="background:rgba(224,74,31,'+(.08+a*.6).toFixed(2)+');'+(n<30?'color:#85827A':'')+'" title="주문 '+fmt(o.n)+'건">'+txt(v,M)+'</td>'}).join('')+'<td>'+txt(val(gx[g],M),M)+'</td></tr>'});
  out.innerHTML=h+'</table></div>';
 }
 $('caveat').innerHTML='<b>읽을 때 주의</b> · 관찰 데이터라 차이가 곧 원인은 아닙니다. 조건을 많이 걸수록 표본이 줄고, 여러 조합을 훑어보면 우연한 차이도 나옵니다. 우연히 보이는 패턴은 가설로만 보시고, 별도 기간·집단에서 확인해야 합니다. 부정 리뷰는 별점 1~2점이며, 도착 기록이 없는 주문은 지연 비율 계산에서 뺍니다.';
 // 상태를 주소에 저장
 var q=['x='+S.x,'y='+S.y,'o='+S.sort];if(S.z)q.push('z='+S.z);for(var k in S.f)if(S.f[k]&&S.f[k].length)q.push('f_'+k+'='+S.f[k].join('.'));
 try{history.replaceState(null,'','#'+q.join('&'))}catch(e){}
}
function sync(){$('x').value=S.x;$('z').value=S.z;$('y').value=S.y;[0,1,2].forEach(function(i){$('s'+i).setAttribute('aria-pressed',S.sort===i)})}
['x','z','y'].forEach(function(k){$(k).onchange=function(){S[k]=this.value;run()}});
[0,1,2].forEach(function(i){$('s'+i).onclick=function(){S.sort=i;sync();run()}});
$('reset').onclick=function(){S.f={};buildFilters();run()};
$('share').onclick=function(){try{navigator.clipboard.writeText(location.href);$('copied').textContent='복사됨'}catch(e){$('copied').textContent='주소창 링크를 복사하세요'}};
var PRE=[['배송 지연별 부정 리뷰',{x:'dl',y:'neg'}],['주문 구성별 부정 리뷰',{x:'ot',y:'neg'}],['월별 늦게 도착한 비율',{x:'m',y:'late'}],['카테고리별 평균 별점',{x:'c',y:'rs'}],['지연 × 주문 구성 (부정 리뷰)',{x:'ot',z:'dl',y:'neg'}],['지역별 평균 배송일',{x:'s',y:'dd'}]];
PRE.forEach(function(p){var b=document.createElement('button');b.type='button';b.textContent=p[0];b.onclick=function(){S.x=p[1].x;S.z=p[1].z||'';S.y=p[1].y;S.f={};sync();buildFilters();run()};$('pre').appendChild(b)});
// 주소에서 복원
(function(){location.hash.slice(1).split('&').forEach(function(p){var kv=p.split('='),k=kv[0],v=kv[1];if(!v)return;
 if(k==='x'&&DIM[v])S.x=v;else if(k==='z'&&DIM[v])S.z=v;else if(k==='y'&&MET[v])S.y=v;else if(k==='o')S.sort=+v||0;
 else if(k.indexOf('f_')===0&&DIM[k.slice(2)])S.f[k.slice(2)]=v.split('.').map(Number).filter(function(n){return n>=0})})})();
sync();buildFilters();run();
})();
</script></body></html>
